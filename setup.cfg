[metadata]
name = universe
version = 0.1.0
description = Simulación física escalable del universo desde partículas fundamentales hasta vida emergente.
long_description = file: README.md
long_description_content_type = text/markdown
author = Proyecto Universo
license = MIT
classifiers =
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    License :: OSI Approved :: MIT License
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Physics

[options]
packages = find:
python_requires = >=3.12
install_requires =
    numpy>=2.2.0
    cupy-cuda12x>=13.4.0
    scipy>=1.13.0
    matplotlib>=3.10
    PyQt5>=5.15.0
    black>=25.0
    flake8>=7.0
    mypy>=1.16.0
    pytest>=8.0
    pytest-cov>=6.0

[options.package_data]
* = *.py
